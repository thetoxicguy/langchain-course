[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "danrolo", email = "danrolodev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-course = "langchain_course:main"

[tool.uv]
# Project lives on an external drive; uv's cache is on the internal disk,
# so hardlinks aren't possible. Copy explicitly to skip the warning.
link-mode = "copy"

[tool.isort]
profile = "black"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.0",
    "isort>=9.0.2",
]
